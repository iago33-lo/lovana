<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovana Joias</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7e6ea;
  color: #333;
}

header {
  background: #e6b7c6;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

section {
  padding: 30px;
}

.produtos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.produto {
  background: #fff;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.produto img {
  width: 100%;
  border-radius: 8px;
}

.produto h3 {
  margin: 10px 0 5px;
}

.produto p {
  font-weight: bold;
}

button {
  background: #d48aa2;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #bf6f8a;
}

.frete {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  max-width: 400px;
  margin: auto;
  text-align: center;
}

input {
  padding: 8px;
  width: 80%;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Lovana 💎</h1>
  <p>Semijoias & Joias</p>
</header>

<section>
  <h2>Nossas Peças</h2>

  <div class="produtos">

    <div class="produto">
      <img src="https://via.placeholder.com/300x300.png?text=Anel+Lovana">
      <h3>Anel Dourado</h3>
      <p>R$ 129,90</p>
      <button onclick="comprar('Anel Dourado', '129,90')">Comprar</button>
    </div>

    <div class="produto">
      <img src="https://via.placeholder.com/300x300.png?text=Colar+Lovana">
      <h3>Colar Elegance</h3>
      <p>R$ 179,90</p>
      <button onclick="comprar('Colar Elegance', '179,90')">Comprar</button>
    </div>

    <div class="produto">
      <img src="https://via.placeholder.com/300x300.png?text=Brinco+Lovana">
      <h3>Brinco Luxo</h3>
      <p>R$ 99,90</p>
      <button onclick="comprar('Brinco Luxo', '99,90')">Comprar</button>
    </div>

  </div>
</section>

<section>
  <h2>Calcule o Frete</h2>

  <div class="frete">
    <input type="text" id="cep" placeholder="Digite seu CEP">
    <br>
    <button onclick="calcularFrete()">Calcular Frete</button>
    <p id="resultadoFrete"></p>
  </div>
</section>

<script>
function comprar(produto, preco) {
  let msg = `Olá! Tenho interesse no produto: ${produto} - R$ ${preco}`;
  let url = `https://wa.me/5538998084982?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function calcularFrete() {
  let cep = document.getElementById("cep").value;
  if (cep.length < 8) {
    document.getElementById("resultadoFrete").innerText = "Digite um CEP válido.";
    return;
  }
  document.getElementById("resultadoFrete").innerText =
    "Frete estimado: R$ 25,00 (valor aproximado)";
}
</script>

</body>
</html>
